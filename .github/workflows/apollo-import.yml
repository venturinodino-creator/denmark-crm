name: Apollo Contact Import

# Manual only: enrichment spends Apollo credits (one per person found), so a
# run is a deliberate act with a cap, not a nightly schedule. Search is free;
# run with dry_run=true first to see how many people would be enriched.
# Needs the APOLLO_API_KEY and SUPABASE_SERVICE_ROLE_KEY secrets.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Search only, spend nothing, insert nothing (true/false)'
        default: 'true'
        required: false
      max_credits:
        description: 'Enrich at most this many people this run (one credit each)'
        default: '400'
        required: false
      inst:
        description: 'Only these institution ids, comma-separated (default: all with a domain)'
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: apollo-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Import decision-makers from Apollo
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          EXTRA="--max-credits ${{ github.event.inputs.max_credits || '400' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ -n "${{ github.event.inputs.inst }}" ]; then EXTRA="$EXTRA --inst ${{ github.event.inputs.inst }}"; fi
          node scripts/apollo-import.js $EXTRA
      - name: Commit import state
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/apollo-import-state.json
          [ -f data/apollo-imported-contacts.json ] && git add data/apollo-imported-contacts.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "apollo: import $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a concurrent run of another workflow) — retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push apollo-import state after 3 attempts. The contacts were inserted into Supabase regardless; only the local audit trail and the already-enriched id list were not saved, so the next run may re-check some ids."
