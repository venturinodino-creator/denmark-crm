name: Daily LeapSpace Competitor Scan

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run competitor scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/competitor-scan.js
      - name: Commit new competitor insights
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/leapspace-competitors.json data/competitor-scan-state.json
          git diff --staged --quiet || git commit -m "competitor-scan: auto-scan $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
